<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifra Tênis Polar - Encriptador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #9d00ff;
            --neon-pink: #ff0055;
            --bg-color: #030712;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background-color: var(--bg-color);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
        }

        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), 
                        inset 0 0 20px rgba(0, 243, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        .gradient-text {
            background: linear-gradient(to right, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .neon-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--neon-blue);
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }

        .neon-input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4),
                        inset 0 0 10px rgba(0, 243, 255, 0.1);
        }

        .neon-input::placeholder {
            color: rgba(0, 243, 255, 0.3);
        }
        
        /* Neon Buttons styling */
        .neon-btn {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        .btn-encrypt {
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
        }
        .btn-encrypt:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        .btn-decrypt {
            border: 1px solid var(--neon-purple);
            color: var(--neon-purple);
        }
        .btn-decrypt:hover {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-purple);
        }

        .btn-clear {
            border: 1px solid var(--neon-pink);
            color: var(--neon-pink);
        }
        .btn-clear:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.6); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4 sm:p-8">

    <canvas id="particle-canvas"></canvas>

    <main class="glass-panel w-full max-w-6xl rounded-3xl p-6 sm:p-8 flex flex-col gap-8 transition-all duration-500 hover:shadow-[0_0_40px_rgba(0,243,255,0.15)]">
        
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider gradient-text uppercase mb-2">
                TP Terminal
            </h1>
            <p class="text-sm text-gray-400 font-light max-w-2xl mx-auto">
                Insira o texto e utilize os botões centrais para codificar ou decodificar a mensagem.
            </p>
        </header>

        <div class="flex flex-col lg:flex-row gap-6 items-stretch w-full">
            
            <!-- Left Textarea: Original Text -->
            <div class="flex-1 flex flex-col gap-2 relative">
                <label for="inputOriginal" class="text-sm font-semibold tracking-widest text-cyan-400 uppercase flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    Texto Original
                </label>
                <textarea id="inputOriginal" 
                          class="neon-input flex-1 w-full min-h-[250px] lg:h-[400px] rounded-xl p-4 resize-none leading-relaxed" 
                          placeholder="Cole seu texto normal aqui..."></textarea>
            </div>

            <!-- Middle Buttons: Controls -->
            <div class="flex flex-row lg:flex-col justify-center items-center gap-4 py-2 lg:py-0">
                <button id="btnEncrypt" class="neon-btn btn-encrypt w-full sm:w-auto lg:w-40 py-3 px-4 rounded flex items-center justify-center gap-2" title="Converter para código">
                    <span>Encriptar</span>
                    <svg class="w-4 h-4 hidden lg:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    <svg class="w-4 h-4 block lg:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                </button>

                <button id="btnDecrypt" class="neon-btn btn-decrypt w-full sm:w-auto lg:w-40 py-3 px-4 rounded flex items-center justify-center gap-2" title="Converter para texto original">
                    <svg class="w-4 h-4 hidden lg:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <svg class="w-4 h-4 block lg:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                    <span>Revelar</span>
                </button>

                <button id="btnClear" class="neon-btn btn-clear w-full sm:w-auto lg:w-40 py-3 px-4 rounded flex items-center justify-center gap-2 mt-0 lg:mt-4" title="Limpar tudo">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    <span>Limpar</span>
                </button>
            </div>

            <!-- Right Textarea: Encrypted Text -->
            <div class="flex-1 flex flex-col gap-2 relative">
                <label for="inputEncrypted" class="text-sm font-semibold tracking-widest text-purple-400 uppercase flex items-center gap-2 lg:justify-end">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Texto Encriptado
                </label>
                <textarea id="inputEncrypted" 
                          class="neon-input flex-1 w-full min-h-[250px] lg:h-[400px] rounded-xl p-4 resize-none leading-relaxed text-purple-300" 
                          placeholder="Cole seu texto cifrado aqui..."></textarea>
            </div>
        </div>
        
    </main>

    <script>
        // Cipher Logic (Tenis Polar Map)
        const cipherMap = {
            't': 'p', 'p': 't',
            'T': 'P', 'P': 'T',
            'e': 'o', 'o': 'e',
            'E': 'O', 'O': 'E',
            'n': 'l', 'l': 'n',
            'N': 'L', 'L': 'N',
            'i': 'a', 'a': 'i',
            'I': 'A', 'A': 'I',
            's': 'r', 'r': 's',
            'S': 'R', 'R': 'S'
        };

        // DOM Elements
        const inputOriginal = document.getElementById('inputOriginal');
        const inputEncrypted = document.getElementById('inputEncrypted');
        const btnEncrypt = document.getElementById('btnEncrypt');
        const btnDecrypt = document.getElementById('btnDecrypt');
        const btnClear = document.getElementById('btnClear');

        // Main translation function
        function translateTenisPolar(text) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                result += cipherMap[char] || char;
            }
            return result;
        }

        // Button Event Listeners
        btnEncrypt.addEventListener('click', () => {
            const textToEncrypt = inputOriginal.value;
            inputEncrypted.value = translateTenisPolar(textToEncrypt);
        });

        btnDecrypt.addEventListener('click', () => {
            const textToDecrypt = inputEncrypted.value;
            inputOriginal.value = translateTenisPolar(textToDecrypt);
        });

        btnClear.addEventListener('click', () => {
            inputOriginal.value = '';
            inputEncrypted.value = '';
        });

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                
                const colors = ['rgba(0, 243, 255,', 'rgba(157, 0, 255,', 'rgba(255, 255, 255,'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.5 + 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `${this.color}${this.alpha})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const numParticles = Math.floor((width * height) / 10000);
            const clampedParticles = Math.min(Math.max(numParticles, 50), 200);
            
            for (let i = 0; i < clampedParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            connectParticles();
            requestAnimationFrame(animate);
        }

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 243, 255, ${0.15 - distance / 1200})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        initParticles();
        animate();

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                initParticles();
            }, 200);
        });

    </script>
</body>
</html>
